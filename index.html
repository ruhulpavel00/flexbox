<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox || Assignment</title>
    <!--=== main or custom css ===-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Left Side Column -->
        <div class="left-side">
            <div class="box red-box"></div>
            <div class="box white-box"></div>
        </div>

        <!-- Right Side Area -->
        <div class="right-side">
            <!-- Top Row -->
            <div class="top-row">
                <div class="box cyan-box"></div>
                <div class="box gold-box"></div>
            </div>

            <!-- Bottom Section -->
            <div class="bottom-section">
                <div class="middle-area">
                    <div class="mid-top">
                        <div class="box gold-small"></div>
                        <div class="box white-wide"></div>
                    </div>
                    <div class="mid-bottom">
                        <div class="box red-wide"></div>
                        <div class="box cyan-small"></div>
                    </div>
                </div>
                <div class="box tall-red"></div>
            </div>
        </div>
    </div>
</body>
</html>
